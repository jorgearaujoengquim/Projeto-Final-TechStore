{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 mb-5 d-flex justify-content-center" style="min-height: 60vh; font-family: 'Segoe UI', system-ui, sans-serif;">
    <div class="card shadow-lg border-0 w-100" style="max-width: 500px; background-color: #1a1d21; border: 1px solid #30363d !important; border-radius: 12px;">
        
        <div class="card-header py-4 text-center" style="background-color: #21262d; border-bottom: 1px solid #30363d; border-radius: 12px 12px 0 0;">
            <i class="bi bi-shield-lock fs-1" style="color: #00d4ff;"></i>
            <h4 class="text-white fw-bold mb-0 mt-2">Alterar Senha</h4>
            <p class="text-white-50 small mb-0 mt-1">Mantenha sua conta segura atualizando sua credencial</p>
        </div>

        <div class="card-body p-4">
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'error' %}alert-danger bg-danger-subtle text-danger{% else %}alert-success bg-success-subtle text-success{% endif %} border-0 mb-4" role="alert" style="border-radius: 8px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'alterar_senha' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label text-white-50 small fw-bold text-uppercase">Nome de Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 text-secondary" style="background-color: #21262d; border-radius: 8px 0 0 8px;"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control px-3" value="{{ request.user.username }}" readonly 
                               style="background-color: #21262d; color: #8b949e; border: 1px solid #30363d; border-radius: 0 8px 8px 0; cursor: not-allowed;">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="nova_senha" class="form-label text-white-50 small fw-bold text-uppercase">Nova Senha</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 text-white-50" style="background-color: #21262d; border-radius: 8px 0 0 8px;"><i class="bi bi-key"></i></span>
                        <input type="password" name="nova_senha" id="nova_senha" class="form-control text-white px-3 input-custom" required placeholder="Digite a nova senha"
                               style="background-color: #161b22; border: 1px solid #30363d; border-radius: 0 8px 8px 0;">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmar_senha" class="form-label text-white-50 small fw-bold text-uppercase">Confirmar Nova Senha</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 text-white-50" style="background-color: #21262d; border-radius: 8px 0 0 8px;"><i class="bi bi-key-fill"></i></span>
                        <input type="password" name="confirmar_senha" id="confirmar_senha" class="form-control text-white px-3 input-custom" required placeholder="Repita a nova senha"
                               style="background-color: #161b22; border: 1px solid #30363d; border-radius: 0 8px 8px 0;">
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-save-password fw-bold py-2" 
                            style="background-color: #00d4ff; color: #000000; border: none; border-radius: 8px; transition: all 0.2s ease;">
                        Salvar Nova Senha
                    </button>
                    <a href="{% url 'login' %}" class="btn text-secondary border-0 small mt-1" style="background-color: transparent;">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

<style>
    .input-custom:focus {
        background-color: #161b22 !important;
        color: #ffffff !important;
        border-color: #00d4ff !important;
        box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.15) !important;
    }
    
    /* Hover do botão de salvar */
    .btn-save-password:hover {
        background-color: #00bcd4 !important;
        color: #000000 !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(0, 212, 255, 0.2);
    }
</style>
{% endblock %}
